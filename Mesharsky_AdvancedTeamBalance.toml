# Advanced Team Balance - configuration
# Version 6.0.0
#
# Place this file at:
# addons/counterstrikesharp/configs/plugins/Mesharsky_AdvancedTeamBalance/Mesharsky_AdvancedTeamBalance.toml

# ======================================
# General
# ======================================
[General]
# Tag shown in front of chat messages. Supports color tags.
PluginTag = "{red}[TeamBalance]{default}"

# Minimum players on teams before skill balancing activates.
# Team size limits are still enforced below this (see AlwaysEnforceTeamSizes).
MinimumPlayers = 6

# Verbose logging for troubleshooting.
EnableDebug = false

# ======================================
# Team switching
# ======================================
[TeamSwitch]
# When balancing runs.
#   "OnRoundStart" / "OnRoundEnd" - full balance at the next round start
#   "OnPlayerJoin"                - enforce team sizes when a player connects
#   "OnPlayerDisconnect"          - enforce team sizes when a player leaves
# Mid-round enforcement only ever moves dead players.
BalanceTriggers = ["OnRoundStart", "OnPlayerJoin"]

# Maximum allowed difference in team sizes. Highest priority rule.
MaxTeamSizeDifference = 1

# Enforce the size limit even when below MinimumPlayers.
AlwaysEnforceTeamSizes = true

# Rounds a player must stay on a team before qualifying for a switch.
MinRoundsBeforeSwitch = 2

# Seconds of immunity after the plugin switches a player.
SwitchImmunityTime = 60

# Maximum player pairs swapped for skill in one balance pass.
MaxSkillSwapsPerRound = 2

# Balance during warmup.
BalanceDuringWarmup = false

# ======================================
# Balancing method
# ======================================
[Balancing]
# Rating used for balancing. One of:
#   "KD"      - kill/death ratio
#   "KDA"     - kill/death ratio including assists
#   "Score"   - in-game scoreboard score
#   "WinRate" - fraction of rounds won
BalanceMode = "KDA"

# Relative strength difference that triggers skill swaps.
# 0.2 means teams may differ by up to 20 percent before the plugin steps in.
SkillDifferenceThreshold = 0.2

# Only enforce team sizes, never swap for skill.
OnlyBalanceByTeamSize = false

# Consecutive lost rounds before the losing team gets a boost. 0 disables.
BoostAfterLoseStreak = 5

# How much stronger (percent) the losing team is allowed to end up.
BoostPercentage = 20

# Scale the boost with the length of the losing streak using the tiers below.
ProgressiveBoost = false

# Losing streak length = boost percentage.
[Balancing.BoostTiers]
3 = 10
5 = 20
7 = 30

# ======================================
# Scramble
# ======================================
[Scramble]
# "Random" shuffles teams, "Skill" deals players out evenly by rating.
Mode = "Random"

# Scramble after one team wins this many rounds in a row. 0 disables.
AfterWinStreak = 5

# Scramble at halftime.
AfterHalftime = false

# Reset player statistics after a scramble.
ResetStats = true

# ======================================
# Chat messages
# ======================================
[Messages]
# Announce balance operations in chat.
AnnounceBalancing = true

# Tell switched players they were moved.
NotifySwitchedPlayers = true

# Include the reason (metric, streaks, team sizes) in announcements.
ExplainBalanceReason = true

# ======================================
# Admin
# ======================================
[Admin]
# Exclude admins from automatic switches.
ExcludeAdmins = true

# Flag that grants exemption from automatic switches.
AdminExemptFlag = "@css/ban"

# Flag required for the plugin's admin commands (css_scramble, css_balancepreview, css_tbreset).
AdminCommandFlag = "@css/generic"
